- name: "Update cache"
  apt:
    update_cache: true
    cache_valid_time: 86400

- name: Add required dependencies.
  apt:
    name:
      - apt-transport-https
      - gnupg2
    state: present
    update_cache: yes

- name: Add Elasticsearch apt key.
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elasticsearch repository.
  apt_repository:
    repo: 'deb https://artifacts.elastic.co/packages/{{ elasticsearch_version }}/apt stable main'
    state: present
    update_cache: true

# CYBERCORE: Logstash REMOVED here (install / enable / start), deliberately.
#   Upstream installs, enables and starts logstash and then configures NO
#   pipeline anywhere in this role -- no logstash.conf, no pipelines.yml, no
#   beats input. winlogbeat ships straight to Elasticsearch (see
#   roles/logs_windows/templates/winlogbeat.yml.j2: output.elasticsearch), so
#   nothing ever reaches logstash and nothing ever leaves it. It is a JVM
#   holding ~1 GB to idle.
#   That is merely wasteful on a throwaway upstream box. Here it is worse: this
#   role runs once on a staging lab and the result is sealed into golden
#   template 1012, so the idle JVM is frozen into the image and then runs in
#   every student lane forever, on lanes that are already RAM-heavy.
#   If a pipeline is ever actually wanted, restore these three tasks TOGETHER
#   WITH the config that gives them a reason to exist. Do not "restore" them
#   from a diff against orange-cyberdefense/GOAD just because they are missing.
- name: Install java
  apt:
    name: openjdk-11-jre
    state: present

- name: Install elasticsearch
  apt:
    name: elasticsearch
    state: present

- name: Install kibana
  apt:
    name: kibana
    state: present

- name: copy kibana config
  copy:
    src: kibana.yml
    dest: /etc/kibana/kibana.yml
    owner: "root"
    group: "kibana"
    mode: 0660

- name: elasticsearch change start timeout to 3min
  lineinfile:
    destfile: /usr/lib/systemd/system/elasticsearch.service
    regexp: 'TimeoutStartSec='
    line: 'TimeoutStartSec=180'

- name: copy elasticsearch config
  copy:
    src: elasticsearch.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: "root"
    group: "elasticsearch"
    mode: 0660

# CYBERCORE: 'enable logstash' removed -- see the note above 'Install java'.
- name: enable elasticsearch
  service:
    name: elasticsearch
    enabled: yes

- name: enable kibana
  service:
    name: kibana
    enabled: yes

# CYBERCORE: 'start logstash' removed -- see the note above 'Install java'.
- name: start elasticsearch
  service:
    name: elasticsearch
    state: started

- name: start kibana
  service:
    name: kibana
    state: started
